<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resolution + Smoothing Simulator</title>

<style>
  body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }

  h2 { margin-bottom: 10px; }

  input[type="file"] { margin: 10px; }

  .controls {
    width: 80%;
    max-width: 600px;
    margin-top: 10px;
  }

  #label {
    margin-top: 10px;
    opacity: 0.8;
    font-size: 14px;
  }

  canvas {
    margin-top: 20px;
    width: 800px;
    height: 450px;
    border: 2px solid #444;
    background: #000;
  }

  input[type="range"] {
    width: 100%;
  }

  button {
    margin-top: 10px;
  }
</style>
</head>

<body>

<h2>Resolution + Smoothing Simulator (Auto Aspect Fit)</h2>

<input type="file" accept="image/*" id="fileInput">

<div class="controls">
  <div>Resolution</div>
  <input type="range" min="1" max="100" value="60" id="resSlider">

  <div style="margin-top:10px;">Smoothing (YouTube Mode)</div>
  <input type="range" min="0" max="100" value="50" id="smoothSlider">

  <div id="label">---</div>

  <button id="exportBtn">Export Image</button>
</div>

<canvas id="canvas" width="800" height="450"></canvas>

<script>
const fileInput = document.getElementById("fileInput");
const resSlider = document.getElementById("resSlider");
const smoothSlider = document.getElementById("smoothSlider");
const label = document.getElementById("label");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const exportBtn = document.getElementById("exportBtn");

let img = new Image();

function sliderToResolution(value) {
  const minLog = Math.log(1);
  const maxLog = Math.log(2160);
  const t = value / 100;
  const logValue = minLog + (maxLog - minLog) * t;
  return Math.max(1, Math.round(Math.exp(logValue)));
}

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    img = new Image();
    img.onload = render;
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

resSlider.addEventListener("input", render);
smoothSlider.addEventListener("input", render);

function render() {
  if (!img.src) return;

  const height = sliderToResolution(parseInt(resSlider.value));
  const width = Math.round(height * (img.width / img.height)); // ✅ AUTO ASPECT RATIO

  const smooth = parseInt(smoothSlider.value) / 100;

  label.textContent =
    `${height}p (${width}×${height}) | Smoothing: ${Math.round(smooth * 100)}%`;

  // low-res buffer
  const lowCanvas = document.createElement("canvas");
  lowCanvas.width = width;
  lowCanvas.height = height;

  const lctx = lowCanvas.getContext("2d");

  lctx.imageSmoothingEnabled = true;
  lctx.drawImage(img, 0, 0, width, height);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.imageSmoothingEnabled = smooth > 0.01;
  ctx.imageSmoothingQuality =
    smooth < 0.3 ? "low" :
    smooth < 0.7 ? "medium" : "high";

  if (smooth > 0.6) {
    ctx.filter = `blur(${(smooth - 0.6) * 6}px)`;
  } else {
    ctx.filter = "none";
  }

  // -------------------------------
  // FIT IMAGE INTO FIXED CANVAS
  // -------------------------------

  const scale = Math.min(
    canvas.width / width,
    canvas.height / height
  );

  const drawW = width * scale;
  const drawH = height * scale;

  const offsetX = (canvas.width - drawW) / 2;
  const offsetY = (canvas.height - drawH) / 2;

  ctx.drawImage(
    lowCanvas,
    0, 0, width, height,
    offsetX, offsetY,
    drawW, drawH
  );

  ctx.filter = "none";
}

/* EXPORT */
exportBtn.addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = `export-${Date.now()}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>

</body>
</html>
